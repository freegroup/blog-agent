# Betriebsparameter. Secrets: .env.example. Sink-URLs und Fachliches: Briefings.

newsroom:
  port: 5080
  queue_dir: ./var/queue
  briefings_dir: ./briefings
  max_attempts: 3
  # Pause wächst mit der Versuchsnummer — verhindert, dass ein kurzer Ausfall alle Versuche verbrennt.
  retry_pause_s: 30
  retention_h: 24

  # Sendet die Dispatch-Entscheidung über Telegram; mcp-telegram schreibt sie in die chat-history.
  mcp: node services/mcp-telegram/index.js

  # LLM-Profil für den Dispatcher (wählt je Pitch die zuständigen Briefings per `when`).
  dispatch:
    llm: quick

  # Reihenfolge der Pipeline-Stufen. Eine Stufe einschieben = Datei in pipeline/ + Eintrag hier.
  # article setzt Bild-Platzhalter, illustrate erzeugt die Bilder danach mit dem fertigen Kontext.
  pipeline: [plot, article, illustrate, description, title, slug]

  # LLM-Profil und MCP-Werkzeuge je Stufe. llm: null = Stufe rechnet modellfrei.
  stages:
    plot:        { llm: default, tools: true }
    article:     { llm: default, tools: true }
    illustrate:  { llm: default }
    description: { llm: quick }
    title:       { llm: quick }
    slug:        { llm: quick }

# MCP-Server als Kindprozesse des Newsrooms. Schlüssel = Name, Wert = Kommandozeile.
mcp:
  calc: node services/mcp-calc/index.js

# LLM-Profile. Jede Pipeline-Stufe referenziert eines per Name.
llm-profiles:
  # gemini-3.5-flash: stabil verfügbar, günstiger als Pro, unterstützt Multi-Round-Tool-Calls.
  default:
    provider: gemini
    model: gemini-3.5-flash
    max_tokens: 16000

  # Für leichte Stufen (description, title, slug, dispatch).
  quick:
    provider: gemini
    model: gemini-3.5-flash-lite
    max_tokens: 2000

stt:
  # Gemini via :generateContent — nimmt OGG/Opus direkt (Telegram-Format). Key: GEMINI_API_KEY.
  # Alternativ: provider: whisper-http, base_url: http://localhost:8000/v1, model: whisper-1
  provider: google
  base_url: https://generativelanguage.googleapis.com/v1beta
  model: gemini-3.5-flash
  language: de

# Bild-Generator für den illustrate-Schritt. Key: GEMINI_API_KEY. Weglassen = No-op.
image:
  provider: google
  base_url: https://generativelanguage.googleapis.com/v1beta
  # flash-image: verfügbar und ausreichend. pro-image ist chronisch überlastet.
  model: gemini-3.1-flash-image

sink-github:
  port: 5081
  api_url: https://api.github.com
  repo: freegroup/CampingElectricCalculator
  base_branch: master
  # Page-bundle-Layout: index.md + Bilder im selben Slug-Verzeichnis, Bild-Refs sind relative Dateinamen.
  content_path: content/blog/{slug}/index.md
  asset_path: content/blog/{slug}/{name}
  # Maschinendoc neben dem Artikel — wird von Revisionen zurückgelesen.
  meta_path: content/blog/{slug}/blogagent.yaml
  label: blogagent
  max_image_bytes: 2097152
  mcp: node services/mcp-telegram/index.js

sink-file:
  port: 5082
  target_dir: ./var/sink
  image_width: 1600
  max_image_bytes: 2097152

sink-deadletter:
  port: 5083
  mcp: node services/mcp-telegram/index.js
  # Gescheiterte Pitches als Markdown — die Telegram-Meldung scrollt weg, die Datei bleibt.
  dir: ./var/deadletter

sink-telegram:
  port: 5084
  mcp: node services/mcp-telegram/index.js

sink-instagram:
  port: 5087
  api_url: https://graph.instagram.com
  # Sink lädt das Bild per GITHUB_TOKEN nach api.github.com hoch, gibt Instagram die raw-URL.
  github_repo: freegroup/blog-agent
  github_branch: instagram-assets
  redirect_uri: http://localhost:5087/oauth/callback
  # An die Caption gehängt, wenn der Pitch keinen target_url mitbringt (Instagram-Links sind nicht klickbar).
  default_link: https://camper-elektrik-planer.de/blog/

sink-pinterest:
  port: 5086
  api_url: https://api.pinterest.com
  # Board-ID aus dem Pinterest-Konto — ohne sie kann kein Pin angelegt werden.
  board_id: ""
  redirect_uri: http://localhost:5086/oauth/callback

source-telegram:
  poll_seconds: 5
  mcp: node services/mcp-telegram/index.js
  # LLM-Profil zum Glätten der Anfrage (Tippfehler/Satzbau).
  llm: quick
  out: http://127.0.0.1:5088/pitches

source-github:
  api_url: https://api.github.com
  repo: freegroup/CampingElectricCalculator
  poll_seconds: 60
  ack_stale_min: 15
  ack_text: "→ weitergeleitet an die Fachabteilung"
  # Antwort an Fremd-Kommentatoren (Login ≠ GITHUB_OWNER): der Kommentar wird ignoriert.
  # Bekannter Standardtext — der Poller erkennt die eigene Notiz und antwortet sich nicht selbst.
  reject_text: "→ Kommentar ignoriert – Revisionen löst nur der Maintainer aus. 😕"
  # Revisionen überspringen die step-research-Stufe — Fakten stehen bereits in blogagent.yaml.
  out: http://127.0.0.1:5080/pitches

# step-dialog: der Empfang vor step-research. Läuft eine Liste kleiner Filter über jede Anfrage
# und entscheidet per Präzedenz: durchreichen, beim Nutzer rückfragen (geparkt in var/queue als
# status: awaiting-reply), direkt antworten, oder ein früheres Posting erneut posten. Sendet dafür
# über Telegram (nur senden, nie pollen — sonst 409). v1: zwei Referenz-Filter aufs „letzte Posting".
step-dialog:
  port: 5088
  out: http://127.0.0.1:5085/pitches
  queue_dir: ./var/queue
  mcp: node services/mcp-telegram/index.js
  # LLM-Profil, mit dem die Filter urteilen (Intent erkennen, Ja/Nein lesen, Sätze mergen).
  llm: quick

# step-research: ein transformierender Schritt vor dem Newsroom — reichert Pitches mit `context` an
# (target_url aus Text oder chat-history) und leitet weiter. Gleiche REST-Schnittstelle wie der
# Newsroom — Schritte sind chainbar.
step-research:
  port: 5085
  out: http://127.0.0.1:5080/pitches

# Conversation log + SSE live-broadcast. Producers: POST /messages.
chat-history:
  port: 5090
  dir: ./var/chat-history
  # Rolling context window written to current.jsonl — entries beyond this are only in the daily logs.
  max_context: 50

# Pollt den RSS-Feed und meldet neue Beiträge auf Telegram — das "ist online"-Signal nach dem Deploy.
watch-rss:
  feed_url: https://camper-elektrik-planer.de/blog/feed.xml
  poll_seconds: 60
  seen_file: ./var/watch-rss-seen.json
  mcp: node services/mcp-telegram/index.js
